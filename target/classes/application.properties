# H2 in-memory database - data resets every time the app restarts (fine for learning/testing)
spring.datasource.url=jdbc:h2:mem:fooddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets you view the database in a browser at http://localhost:8080/h2-console
# JDBC URL to paste there: jdbc:h2:mem:fooddb
spring.h2.console.enabled=true

# Auto-creates/updates tables from your @Entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Allows JSON requests that omit a primitive field (e.g. quantity in a PATCH request)
# to default to 0 instead of throwing an error
spring.jackson.deserialization.fail-on-null-for-primitives=false
